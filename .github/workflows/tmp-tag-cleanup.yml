# TEMPORARY: removes the leftover git tag created by the write-scope probe.
# Gitee API v5 has no tag-delete endpoint, so this deletes the remote ref via git push.
# The token goes into a credentials file (never into the command line or a URL), and
# GitHub masks secret values in logs anyway.
# This file is deleted again right after the run.

name: TEMP gitee tag cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'furret2333/NoriDroid'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GITEE_OWNER: HuiQwQ
      GITEE_REPO: nori-droid
      STRAY_TAG: ci-writetest

    steps:
      - name: Delete stray test tag on Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          REPO_URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          # credentials file: keeps the token out of the command line and out of URLs
          printf 'https://%s:%s@gitee.com\n' "${GITEE_OWNER}" "${GITEE_TOKEN}" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global credential.helper store
          git config --global advice.detachedHead false

          # git push needs a repository context even for a bare "delete remote ref"
          git init -q .

          echo "== tags before =="
          git ls-remote --tags "$REPO_URL" | awk '{print $2}'

          echo "== deleting refs/tags/${STRAY_TAG} =="
          git push "$REPO_URL" ":refs/tags/${STRAY_TAG}"

          echo "== tags after =="
          git ls-remote --tags "$REPO_URL" | awk '{print $2}'

          if git ls-remote --tags "$REPO_URL" | grep -q "refs/tags/${STRAY_TAG}$"; then
            echo "::error:: stray tag still present"
            exit 1
          fi
          echo "STRAY TAG REMOVED"

      - name: Shred credentials file
        if: always()
        run: rm -f "$HOME/.git-credentials" && echo "credentials file removed"
