# 把 GitHub Release 里的 APK 同步到 Gitee（国内下载加速通道）
#
# 官网下载主按钮指向 Gitee 仓库 `dl/<文件名>` 的 raw 文件（返回 application/octet-stream）。
# ⚠ Gitee 的「发行版附件」返回 Content-Type: application/zip，浏览器会把 apk 当压缩包，
#   所以**不能**用它做下载链接；它只作为 releases 页面的可浏览资产，属于可选步骤。
#
# 步骤顺序有意为之：**关键路径（raw 副本）放在最前面**，
#   可选的发行版附件上传放在最后并允许失败/限时——它在 2026-10-20 曾把 9.7MB 的包上传卡死，
#   导致整条工作流被取消、官网下载 404。
#
# 触发：公开仓库发布 Release 时自动跑；也可手动 workflow_dispatch 补同步（幂等）。
# 权限：只读（contents: read）——不提交任何代码；只读 Release 资产 + 调 Gitee。

name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to sync (e.g. 2.4.0); empty = latest release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sync-gitee-${{ github.event.release.tag_name || github.event.inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'furret2333/NoriDroid'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITEE_OWNER: HuiQwQ
      GITEE_REPO: nori-droid

    steps:
      - name: Resolve tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag resolved: ${TAG}"

      - name: Download APK from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dist --clobber
          ls -l dist
          APK="$(ls dist/*.apk | head -n1)"
          echo "APK=${APK}" >> "$GITHUB_ENV"
          echo "APK_SHA=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "local apk: ${APK} (sha256 ${APK_SHA})"

      # ===== 关键路径：官网下载链接指向这里，必须最先完成 =====
      - name: Publish raw copy in the Gitee repo (this is what the website links to)
        timeout-minutes: 12
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error:: GITEE_TOKEN secret is missing. Add it in the public repo: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${APK:-}" ] || [ ! -f "${APK:-}" ]; then
            echo "::error:: APK env var is empty or the file is missing - the download step did not produce one."
            exit 1
          fi

          NAME="$(basename "$APK")"
          printf 'https://%s:%s@gitee.com\n' "${GITEE_OWNER}" "${GITEE_TOKEN}" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global credential.helper store
          git config --global user.name "NoriDroid CI"
          git config --global user.email "noreply@users.noreply.github.com"

          rm -rf gitee-repo
          git clone --depth 1 "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" gitee-repo
          cd gitee-repo
          mkdir -p dl

          # 只保留最近的 2 个 apk，避免工作区无限膨胀（git 历史仍会累积）
          if ls dl/*.apk >/dev/null 2>&1; then
            ls -1t dl/*.apk | tail -n +3 | while read -r old; do git rm -q --ignore-unmatch "$old"; done
          fi

          cp "${GITHUB_WORKSPACE}/${APK}" "dl/${NAME}"
          git add -A dl
          if git diff --cached --quiet; then
            echo "raw copy already up to date"
          else
            git commit -m "dl: publish ${NAME}"
            git push origin HEAD:master
            echo "raw copy pushed"
          fi
          cd ..
          echo "raw url: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/master/dl/${NAME}"

      - name: Verify the raw URL the website uses
        timeout-minutes: 10
        run: |
          set -euo pipefail
          NAME="$(basename "$APK")"
          URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/master/dl/${NAME}"
          echo "verify url: ${URL}"

          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 180 -o got.apk "$URL"; then break; fi
            echo "attempt ${i} not ready yet, waiting 10s..."
            sleep 10
          done
          test -s got.apk

          echo "== content-type check (must NOT be application/zip) =="
          CT="$(curl -s -I -L --max-time 60 "$URL" | tr -d '\r' | awk 'tolower($1)=="content-type:"{v=$2} END{print v}')"
          echo "content-type: ${CT}"
          case "$CT" in
            *zip*) echo "::error:: served as zip, browsers will treat the apk as an archive"; exit 1 ;;
            "") echo "::error:: could not read content-type"; exit 1 ;;
          esac

          GOT="$(sha256sum got.apk | awk '{print $1}')"
          echo "github sha256: ${APK_SHA}"
          echo "gitee  sha256: ${GOT}"
          if [ "$GOT" != "$APK_SHA" ]; then
            echo "::error:: SHA-256 mismatch, the synced file looks wrong"
            exit 1
          fi
          echo "OK: raw copy matches the GitHub release asset and is not served as a zip"

      # ===== 可选路径：给人浏览 Gitee releases 页面用。失败/超时都不影响官网下载 =====
      - name: Sync release attachment to Gitee (optional, never blocks the site)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          NAME="$(basename "$APK")"

          REL_ID="$(curl -sS "$API/releases/tags/${TAG}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("id") or "")' 2>/dev/null || true)"
          if [ -z "$REL_ID" ]; then
            echo "release ${TAG} not found on Gitee, creating..."
            REL_ID="$(curl -sS -X POST "$API/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "name=NoriDroid ${TAG}" \
              --data-urlencode "body=Synced automatically from the GitHub release: NoriDroid ${TAG}" \
              --data-urlencode "target_commitish=master" \
              --data-urlencode "prerelease=false" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("id") or "")' 2>/dev/null || true)"
          fi
          if [ -z "$REL_ID" ]; then
            echo "::warning:: could not find or create the Gitee release ${TAG} (harmless: the site uses the raw copy)"
            exit 0
          fi
          echo "gitee release id = ${REL_ID}"

          HAVE="$(curl -sS "$API/releases/${REL_ID}/attach_files" | python3 -c 'import sys,json;print("\n".join(a.get("name","") for a in json.load(sys.stdin)))' 2>/dev/null || true)"
          if printf '%s\n' "$HAVE" | grep -Fxq "$NAME"; then
            echo "${NAME} already attached on Gitee, nothing to do"
            exit 0
          fi

          # 大文件上传可能很慢甚至卡住；限时 + continue-on-error，卡住也只影响这一步
          echo "uploading ${NAME} (this step is optional) ..."
          curl -sS --max-time 240 --connect-timeout 20 -X POST "$API/releases/${REL_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK}" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print("uploaded:", d.get("browser_download_url") if isinstance(d,dict) else d)'

      - name: Shred credentials file
        if: always()
        run: rm -f "$HOME/.git-credentials" && echo "credentials file removed"
