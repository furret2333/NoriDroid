# TEMPORARY: tests whether Gitee's raw file endpoint serves .apk with a sane MIME,
# which would give us both correct Content-Type and Gitee's fast CDN in China.
# It pushes the release APK into the Gitee repo at dl/<name> and prints the raw headers.
# The file is removed again right after the experiment.

name: TEMP gitee raw mime test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'furret2333/NoriDroid'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITEE_OWNER: HuiQwQ
      GITEE_REPO: nori-droid
      TAG: 2.3.0

    steps:
      - name: Get the APK from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dist --clobber
          ls -l dist

      - name: Push APK into the Gitee repo and inspect raw headers
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          APK="$(ls dist/*.apk | head -n1)"
          NAME="$(basename "$APK")"
          printf 'https://%s:%s@gitee.com\n' "${GITEE_OWNER}" "${GITEE_TOKEN}" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global credential.helper store
          git config --global user.name "HuiOVO"
          git config --global user.email "317002734+furret2333@users.noreply.github.com"

          echo "== clone gitee repo =="
          rm -rf repo
          git clone --depth 1 "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" repo
          cd repo
          echo "== branch =="
          git branch --show-current

          mkdir -p dl
          cp "../${APK}" "dl/${NAME}"
          ls -l dl

          git add "dl/${NAME}"
          if git diff --cached --quiet; then
            echo "nothing to commit (already present)"
          else
            git commit -m "add dl/${NAME} for raw-endpoint MIME test"
            git push origin HEAD
            echo "pushed"
          fi
          cd ..

          echo ""
          echo "== raw headers (this is what we came for) =="
          RAW="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/master/dl/${NAME}"
          echo "url=${RAW}"
          curl -s -I -L --max-time 60 "$RAW" | sed -n '1,30p'
          echo ""
          echo "== download speed from raw =="
          curl -s -L --max-time 90 -o got.apk -w 'code=%{http_code} bytes=%{size_download} secs=%{time_total}\n' "$RAW"
          echo "local=$(sha256sum "../${APK}" | awk '{print $1}')"
          echo "raw  =$(sha256sum got.apk | awk '{print $1}')"

      - name: Shred credentials
        if: always()
        run: rm -f "$HOME/.git-credentials" && echo "credentials removed"
