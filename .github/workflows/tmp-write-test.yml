# TEMPORARY: proves the GITEE_TOKEN has write scope (create release + upload asset).
# Self-cleaning: the release it creates is deleted in an "always()" step.
# This file lives only in the public repo and is deleted again right after the run.
# (A sync-public run would also wipe it, since the archive is the source of truth.)

name: TEMP gitee write test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'furret2333/NoriDroid'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITEE_OWNER: HuiQwQ
      GITEE_REPO: nori-droid
      TEST_TAG: ci-writetest

    steps:
      - name: Download a real APK to upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v2.2.0 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dist --clobber
          ls -l dist

      - name: Probe write scope (create + upload + read back)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          APK="$(ls dist/*.apk | head -n1)"

          echo "== step 1: create release =="
          CODE="$(curl -sS -o rel.json -w '%{http_code}' -X POST "$API/releases" \
            -d "access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TEST_TAG}" \
            --data-urlencode "name=CI write test (auto-cleaned)" \
            --data-urlencode "body=Temporary write-scope probe. Deleted automatically." \
            --data-urlencode "target_commitish=master")"
          echo "create http=${CODE}"
          head -c 400 rel.json; echo
          REL_ID="$(python3 -c 'import json;print(json.load(open("rel.json")).get("id") or "")' || true)"
          echo "REL_ID=${REL_ID}" >> "$GITHUB_ENV"
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            echo "::error:: CREATE FAILED http=${CODE} (403 => token lacks 'projects' scope)"
            exit 1
          fi
          if [ -z "$REL_ID" ]; then
            echo "::error:: create returned no id"
            exit 1
          fi

          echo "== step 2: upload asset =="
          CODE2="$(curl -sS -o up.json -w '%{http_code}' -X POST "$API/releases/${REL_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK}")"
          echo "upload http=${CODE2}"
          head -c 400 up.json; echo
          if [ "$CODE2" != "201" ] && [ "$CODE2" != "200" ]; then
            echo "::error:: UPLOAD FAILED http=${CODE2}"
            exit 1
          fi

          echo "== step 3: read back and compare sha256 =="
          URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${TEST_TAG}/$(basename "$APK")"
          echo "url=${URL}"
          curl -fsSL --max-time 120 -o got.apk "$URL"
          A="$(sha256sum "$APK" | awk '{print $1}')"
          B="$(sha256sum got.apk | awk '{print $1}')"
          echo "local=${A}"
          echo "gitee=${B}"
          if [ "$A" != "$B" ]; then
            echo "::error:: sha256 mismatch"
            exit 1
          fi
          echo "WRITE-SCOPE PROBE PASSED"

      - name: Cleanup (always)
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          ID="${REL_ID:-}"
          if [ -z "$ID" ]; then
            curl -sS -o rel2.json "$API/releases/tags/${TEST_TAG}" || true
            ID="$(python3 -c 'import json;print(json.load(open("rel2.json")).get("id") or "")' 2>/dev/null || true)"
          fi
          if [ -n "$ID" ]; then
            echo "deleting test release id=${ID}"
            curl -sS -o del.json -w 'delete http=%{http_code}\n' -X DELETE "$API/releases/${ID}?access_token=${GITEE_TOKEN}" || true
            head -c 200 del.json 2>/dev/null; echo
          else
            echo "no test release to delete"
          fi
          echo "trying to delete test tag ${TEST_TAG}"
          curl -sS -o tag.json -w 'tag delete http=%{http_code}\n' -X DELETE "$API/tags/${TEST_TAG}?access_token=${GITEE_TOKEN}" || true
          head -c 200 tag.json 2>/dev/null; echo
          echo "cleanup finished"
