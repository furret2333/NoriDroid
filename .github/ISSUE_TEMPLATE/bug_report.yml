name: Android bug report
description: Report a reproducible problem in the NoriDroid Android app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. Never include API keys or private chat data.

  - type: input
    id: version
    attributes:
      label: App version
      description: Include the version name and version code shown in the app or APK.
      placeholder: v2.0.0 (2)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Phone/tablet model and Android version.
      placeholder: Pixel 8, Android 14
    validations:
      required: true

  - type: dropdown
    id: install_type
    attributes:
      label: Install type
      options:
        - Fresh install
        - Upgrade over an earlier NoriDroid version
        - Debug build
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove API keys, tokens, chat content, and personal paths before posting.
      render: text
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording

  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I removed secrets and private data from logs.
          required: true
