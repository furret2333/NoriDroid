plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.noridroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.noridroid"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "2.5.2"
    }

    /* 2026-10-02 鐢ㄦ埛瑕佹眰鍒囨寮忕鍚嶃€俴eystore.properties 鍦?.gitignore 閲岋紙涓嶈繘浠撳簱/鍏紑浠撳簱锛夛紱
       璇ユ枃浠朵笉瀛樺湪鏃讹紙鍒鏋勫缓锛夎嚜鍔ㄥ洖钀?debug 绛惧悕锛岄伩鍏嶆瀯寤哄け璐ャ€?*/
    def ksProps = new Properties()
    def ksPropsFile = rootProject.file("keystore.properties")
    if (ksPropsFile.exists()) { ksPropsFile.withInputStream { ksProps.load(it) } }
    def hasReleaseKey = ksPropsFile.exists() && ksProps['storeFile']
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "NoriDroid-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
